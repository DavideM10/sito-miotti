<!DOCTYPE html>
<html>
<head>
  <title>Home di Miotti</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" type="text/css" href="css/ui.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #ada7a7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .dashboard-container {
      background: white;
      padding: 150px;
      border-radius: 18px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .icons-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }
    .btn-logout {
      display: block;
      margin-top: 20px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(to right, #d9534f, #c9302c);
      transition: transform .2s ease, opacity .2s ease;
    }

    .btn-logout:hover {
      transform: scale(1.05);
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h1>Benvenuto nella home di Sito Miotti!</h1>
    <p>Scegli come proseguire.</p>
    <div class="icons-row">
      <a href="terminale.html" class="terminal-image-btn">
          <img src="img/terminal-icon.png" alt="Terminale" />
      </a>
      <a href="calcolatrice.html" class="terminal-image-btn">
          <img src="img/calculator-icon.png" alt="Calcolatrice" />
      </a>
      <a href="pingpong.html" class="terminal-image-btn">
          <img src="img/pingpong-icon.png" alt="Ping Pong" />
      </a>
      <a href="sintesi.html" class="terminal-image-btn">
          <img src="img/speaker-icon.png" alt="Sintesi Vocale" />
      </a>
      <a href="timer.html" class="terminal-image-btn" title="Timer e Cronometro">
          <img src="img/clock-icon.png" alt="Timer e Cronometro" />
      </a>
      <a href="auto-race.html" class="terminal-image-btn" title="Gioco Auto">
          <img src="img/car_icon.png" alt="Gioco Auto" />
      </a>
    </div>
    <a href="index.html" class="btn-logout">Logout</a>
  </div>
  <script src="js/ui.js"></script>
</body>
</html>

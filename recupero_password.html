<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recupero Password</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/ui.css" />
  <style>
    :root {
      --bg: #eef4ff;
      --panel: #ffffff;
      --ink: #162033;
      --muted: #5f6d84;
      --accent: #2ebf90;
      --accent-2: #36d4a0;
      --danger: #c93131;
      --line: #d7e2f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(46, 191, 144, 0.2), transparent 28%),
        radial-gradient(circle at 85% 90%, rgba(54, 212, 160, 0.2), transparent 35%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .card {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 22px 40px rgba(16, 36, 74, 0.14);
      padding: 28px;
    }

    h1 {
      margin: 0;
      font-size: 1.65rem;
    }

    .subtitle {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #cdd9ea;
      background: #f9fbff;
      font-size: 1rem;
      color: var(--ink);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(46, 191, 144, 0.2);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button,
    .btn-link {
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background-position 0.2s ease;
    }

    .btn-primary {
      color: #fff;
      background-image: linear-gradient(to right, var(--accent), var(--accent-2), var(--accent));
      background-size: 220% 100%;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      background-position: 100% 0;
    }

    .btn-link {
      color: #fff;
      background: #3b475a;
    }

    .btn-link:hover {
      transform: translateY(-1px);
      background: #313b4b;
    }

    .hint {
      margin-top: 14px;
      font-size: 0.83rem;
      color: #5e6a80;
      background: #f4f8ff;
      border-radius: 10px;
      border: 1px solid #d9e4f5;
      padding: 10px 12px;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Recupero Password</h1>
    <p class="subtitle">Inserisci username o email e imposta una nuova password.</p>

    <form id="recoverForm">
      <div class="field">
        <label for="identifier">Username o Email</label>
        <input id="identifier" name="identifier" type="text" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="new_password">Nuova Password</label>
        <input id="new_password" name="new_password" type="password" minlength="8" required autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="confirm_password">Conferma Nuova Password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" />
      </div>

      <div class="actions">
        <button class="btn-primary" type="submit">Aggiorna Password</button>
        <a class="btn-link" href="index.html">Torna al Login</a>
      </div>
    </form>

    <p class="hint">Demo locale: i dati utenti sono salvati nel browser (localStorage).</p>
  </section>

  <script src="js/ui.js"></script>
  <script src="js/auth-store.js"></script>
  <script src="js/recovery.js"></script>
</body>
</html>
